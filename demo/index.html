<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aster Forms · A better way to ask</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f8f8fb;
        color: #292b3a;
        font-family: system-ui, sans-serif;
      }
      .demo-top {
        max-width: 1600px;
        padding: 34px 4% 24px;
        margin: auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }
      .demo-top .eyebrow {
        color: #8b86ac;
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.16em;
      }
      .demo-top h1 {
        font-size: 30px;
        font-weight: 550;
        letter-spacing: -1px;
        margin: 8px 0;
      }
      .demo-top p {
        font-size: 12px;
        color: #838392;
        margin: 0;
        line-height: 1.7;
      }
      .demo-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .demo-actions button,
      .demo-actions a {
        border: 1px solid #dedde8;
        background: white;
        color: #6c667d;
        border-radius: 7px;
        padding: 8px 12px;
        font: 11px system-ui;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
      }
      .demo-actions .tag {
        font-size: 10px;
        color: #8b85a1;
        margin-right: 10px;
      }
      body > main {
        padding: 0 4%;
        max-width: 1600px;
        margin: auto;
      }
      footer {
        max-width: 1600px;
        margin: auto;
        padding: 20px 4%;
        font-size: 10px;
        color: #92909f;
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }
      .response {
        margin: 20px 0;
        background: #242334;
        color: #eeeafa;
        border-radius: 10px;
        padding: 20px;
        overflow: auto;
        max-height: 400px;
        font-size: 12px;
      }
      .response[hidden] {
        display: none;
      }
      @media (max-width: 740px) {
        .demo-top {
          padding: 24px 4%;
          flex-direction: column;
          align-items: flex-start;
        }
        .demo-top h1 {
          font-size: 27px;
        }
        .demo-actions {
          flex-wrap: wrap;
        }
        .demo-actions .tag {
          display: none;
        }
        footer {
          flex-direction: column;
          gap: 5px;
        }
      }
    </style>
  </head>
  <body>
    <header class="demo-top">
      <div>
        <div class="eyebrow">THE FORM DESIGN WORKSPACE</div>
        <h1>A better way to ask.</h1>
        <p>Design a conversation. See it come to life. Keep the data yours.</p>
      </div>
      <div class="demo-actions">
        <span class="tag">ASTER FORMS · v0.1</span><a href="/README.md">Docs</a
        ><button id="reset">Reset example</button
        ><button id="standalone">Open runner</button
        ><button id="back" hidden>Back to builder</button>
      </div>
    </header>
    <main>
      <div id="app"></div>
      <pre id="response" class="response" hidden></pre>
    </main>
    <footer>
      <span
        >Visual form design · Eight field types · No runtime dependencies</span
      ><span>Your forms. Your data. Your infrastructure.</span>
    </footer>
    <script type="module" src="/demo/main.js"></script>
  </body>
</html>
